# ─────────────────────────────────────────────────────
# Module   : pubspec.yaml (Configuration & Dependencies)
# ─────────────────────────────────────────────────────
name: notification_timeline_app
description: "Smart Notification Timeline & Tracker - Production Flutter Android App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Background notification listening on Android
  flutter_notification_listener: ^1.4.0

  # Local SQLite database & path handling
  sqflite: ^2.3.0
  path: ^1.8.3

  # Biometric and Secure Storage Security Layer
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0

  # Export and Sharing
  share_plus: ^7.2.1
  path_provider: ^2.1.2

  # UI, Fonts & Date Formatting
  intl: ^0.19.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
